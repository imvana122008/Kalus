                    formText = formText
.replace(/\n+/g, '\n') //
.replace(/^\s+|\s+$/g, '') //
.replace(/\s*\n\s*/g, '\n') //
.replace(/\n{2,}/g, '\n'); //
                    
                    const lines = formText.split('\n');
                    const formattedLines = lines.map(line => line.trim()).filter(line => line.length > 0);
                    
                    // Собираем обратно в строку
                    const finalText = formattedLines.join('\n');
                    
                    copyToClipboard(finalText, copyAllBtn);
                });

                copyTemplateBtn.addEventListener('click', () => {
                    copyToClipboard(formTemplate, copyTemplateBtn);
                });

                applicationForm.addEventListener('click', function() {
                    this.focus();
                });

                applicationForm.setAttribute('contenteditable', 'true');

                const observerOptions = {
                    threshold: 0.1,
                    rootMargin: '0px 0px -50px 0px'
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
if (entry.isIntersecting) {
    entry.target.classList.add('fade-in');
}
                    });
                }, observerOptions);

                this.shadowRoot.querySelectorAll('.notice-card, .requirements-section, .form-section, .important-note').forEach((el) => {
                    observer.observe(el);
                });

                this.shadowRoot.querySelectorAll('.requirement-item').forEach(item => {
                    item.addEventListener('mouseenter', function() {
this.style.transform = 'translateX(5px)';
                    });
                    
                    item.addEventListener('mouseleave', function() {
this.style.transform = 'translateX(0)';
                    });
                });

                window.addEventListener('load', () => {
                    this.shadowRoot.querySelector('.container').style.opacity = '0';
                    this.shadowRoot.querySelector('.container').style.transition = 'opacity 0.9s ease';
                    
                    setTimeout(() => {
this.shadowRoot.querySelector('.container').style.opacity = '1';
                    }, 100);
                    
                    setTimeout(() => {
this.shadowRoot.querySelectorAll('.fade-in').forEach(el => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(30px)';
});
                    }, 300);
                });

                applicationForm.addEventListener('focus', function() {
                    this.style.boxShadow = '0 0 0 2px rgba(255, 204, 0, 0.3)';
                    this.style.backgroundColor = 'rgba(0, 0, 0, 0.3)';
                });

                applicationForm.addEventListener('blur', function() {
                    this.style.boxShadow = 'none';
                    this.style.backgroundColor = 'rgba(0, 0, 0, 0.2)';
                });

                applicationForm.addEventListener('dblclick', function() {
                    const range = document.createRange();
                    range.selectNodeContents(this);
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(range);
                });

                applicationForm.addEventListener('keydown', function(e) {

                    if (e.key === 'Enter') {
e.preventDefault();

const selection = window.getSelection();
const range = selection.getRangeAt(0);

const br = document.createElement('br');
range.deleteContents();
range.insertNode(br);

range.setStartAfter(br);
range.collapse(true);
selection.removeAllRanges();
selection.addRange(range);
                    }
                });

                applicationForm.addEventListener('input', function() {
                    const selection = window.getSelection();
                    const range = selection.getRangeAt(0);
                    const caretPosition = range.startOffset;
                    
                    let content = this.innerHTML;
                    content = content.replace(/\s{2,}/g, ' ');
                    content = content.replace(/(<br\s*\/?>\s*){2,}/gi, '<br>');
                    this.innerHTML = content;
                    setTimeout(() => {
const newRange = document.createRange();
const textNode = this.childNodes[0] || this;
newRange.setStart(textNode, Math.min(caretPosition, textNode.length));
newRange.collapse(true);
selection.removeAllRanges();
selection.addRange(newRange);
                    }, 0);
                });
            }
        }

        customElements.define('moderator-application', ModeratorApplication);
    </script>

</div>
