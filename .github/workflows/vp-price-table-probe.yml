name: Probe VP price table source

on:
  push:
    paths:
      - '.github/workflows/vp-price-table-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect price-table page
        shell: bash
        run: |
          # probe revision 2026-10-04b
          set -euo pipefail
          python3 - <<'PY'
          import html,re,urllib.parse,urllib.request,urllib.error
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36'}
          def get(url):
            req=urllib.request.Request(url,headers=UA)
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                b=r.read(); print('HTTP',r.status,url,'TYPE',r.headers.get('content-type'),'BYTES',len(b)); return b.decode('utf-8','replace'),r.geturl()
            except urllib.error.HTTPError as e:
              b=e.read(); print('HTTP',e.code,url,'BODY',b[:500].decode('utf-8','replace')); return '',url
          text,final=get('https://vp.szx.su/market/price-table')
          attrs=[]
          for m in re.finditer(r'''(?:href|src)=[\"']([^\"']+)[\"']''',text,re.I): attrs.append(urllib.parse.urljoin(final,html.unescape(m.group(1))))
          for u in dict.fromkeys(x for x in attrs if re.search(r'\.js(?:\?|$)',x,re.I)):
            js,_=get(u)
            for m in re.finditer(r'price.?table|average|avg|median|external/[^\"\']+|api/[^\"\']+',js,re.I):
              frag=re.sub(r'\s+',' ',js[max(0,m.start()-650):min(len(js),m.end()+1300)])
              if any(x in frag.lower() for x in ['price','средн','median','market','table']): print('CTX',u,frag[:1900])
          PY
