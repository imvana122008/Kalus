name: Probe Sakai Shinoa UID route

on:
  push:
    paths:
      - '.github/workflows/sakai-uid-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public XPI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -A 'Mozilla/5.0' 'https://addons.mozilla.org/firefox/downloads/file/5026218/arizona_helper_by_sakai-12.7.xpi' -o sakai.xpi
          rm -rf sakai && mkdir sakai && unzip -q sakai.xpi -d sakai
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=(Path('sakai')/'script.js').read_text('utf-8',errors='ignore')
          for needle in ['function getPlayerName','const getPlayerName','getPlayerName =','LOG_ID_TO_PREFIX_ID_MAP','shinoa-player-info']:
            start=0
            for i in range(10):
              pos=s.find(needle,start)
              if pos<0: break
              frag=re.sub(r'\s+',' ',s[max(0,pos-1200):min(len(s),pos+3200)])
              print('CTX',needle,frag[:4300])
              start=pos+len(needle)
          bg=(Path('sakai')/'background.js').read_text('utf-8',errors='ignore')
          for needle in ['LOG_ID_TO_PREFIX_ID_MAP','/api/v1/name','shinoa-player-info']:
            start=0
            for i in range(8):
              pos=bg.find(needle,start)
              if pos<0: break
              frag=re.sub(r'\s+',' ',bg[max(0,pos-1200):min(len(bg),pos+3000)])
              print('BGCTX',needle,frag[:4200])
              start=pos+len(needle)
          PY
