name: Probe VP developer API rules

on:
  push:
    paths:
      - '.github/workflows/vp-api-rules-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read public developer API pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,urllib.request,urllib.error
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36'}
          for url in ['https://vp.szx.su/api/rules','https://vp.szx.su/api','https://vp.szx.su/api/docs']:
            try:
              r=urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=25)
              b=r.read().decode('utf-8','replace')
              print('URL',url,'STATUS',r.status,'TYPE',r.headers.get('content-type'),'BYTES',len(b))
              text=re.sub(r'<script[\s\S]*?</script>',' ',b,flags=re.I)
              text=re.sub(r'<style[\s\S]*?</style>',' ',text,flags=re.I)
              text=re.sub(r'<[^>]+>',' ',text)
              text=re.sub(r'\s+',' ',text)
              print('TEXT',text[:10000])
              for m in re.finditer(r'https?://[^\"\'\s<>]+|/(?:api|external)/[A-Za-z0-9_./?=&%:-]+',b,re.I):
                print('TOKEN',m.group(0)[:600])
            except urllib.error.HTTPError as e:
              print('URL',url,'STATUS',e.code,'BODY',e.read()[:2000].decode('utf-8','replace'))
            except Exception as e: print('ERROR',url,repr(e))
          PY
