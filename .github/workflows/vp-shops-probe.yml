name: Probe VP public market endpoint

on:
  push:
    paths:
      - '.github/workflows/vp-shops-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Single polite VP request
        shell: bash
        run: |
          set -euo pipefail
          echo 'Waiting before the only API request...'
          sleep 12
          python3 - <<'PY'
          import urllib.request, urllib.error
          url='https://api.szx.su/external/items/market?item_id=1&server_id=4&period=1y'
          req=urllib.request.Request(url,headers={'User-Agent':'Kalus-Chandler/price-source-check (+https://github.com/imvana122008/Kalus)','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  body=r.read()
                  print('HTTP',r.status,'TYPE',r.headers.get('content-type'),'BYTES',len(body))
                  print('BODY',body[:4000].decode('utf-8','replace'))
          except urllib.error.HTTPError as e:
              body=e.read()
              print('HTTP',e.code,'TYPE',e.headers.get('content-type'),'BYTES',len(body))
              print('BODY',body[:4000].decode('utf-8','replace'))
          PY
