name: Arizona item prices
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Scan the complete Wiki catalog once'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/arz-prices.yml'
      - '.github/arz-prices/**'
permissions:
  contents: read
  id-token: write
concurrency:
  group: arz-prices-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install browser client
        run: npm install --prefix .github/arz-prices --no-save --silent playwright-core@1.55.0
      - name: Verify price parser
        run: node --test .github/arz-prices/refresh.test.cjs
      - name: Update Site price cache
        env:
          FULL_SCAN: ${{ inputs.full_scan || 'false' }}
        run: node .github/arz-prices/refresh.cjs
