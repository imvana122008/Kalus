name: Arizona item prices
on:
  workflow_dispatch:
  schedule:
    # Night refresh window. GitHub cron is UTC: five passes from 00:17 to 04:17.
    - cron: '17 0-4 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: arz-prices-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install browser client
        run: npm install --prefix .github/arz-prices --no-save --silent playwright-core@1.55.0
      - name: Verify price parser
        run: node --test .github/arz-prices/refresh.test.cjs
      - name: Update price cache
        run: node .github/arz-prices/refresh.cjs
