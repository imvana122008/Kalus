name: PRIDE KEEPER Helper rolling release

on:
  push:
    branches: [main]
    paths:
      - 'pride-keeper-staff/**'
      - '.github/workflows/pride-keeper-staff-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pride-keeper-staff-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate modules and run tests
        run: |
          find pride-keeper-staff/extension -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test pride-keeper-staff/extension/tests/*.test.js
      - name: Validate manifest resources and update version
        id: version
        run: |
          python - <<'PY'
          import json, pathlib, os
          root = pathlib.Path('pride-keeper-staff/extension')
          manifest = json.loads((root / 'manifest.json').read_text())
          update = json.loads(pathlib.Path('pride-keeper-staff/update.json').read_text())
          assert manifest['version'] == update['version']
          resources = [manifest['background']['service_worker'], *manifest['icons'].values()]
          for script in manifest['content_scripts']:
              resources.extend(script.get('js', []) + script.get('css', []))
          for group in manifest.get('web_accessible_resources', []):
              resources.extend(group['resources'])
          for resource in resources:
              assert (root / resource).is_file(), resource
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + manifest['version'] + '\n')
          PY
      - name: Build ZIP
        run: |
          mkdir -p dist
          cd pride-keeper-staff/extension
          zip -r ../../dist/PRIDE_KEEPER_Staff_latest.zip . -x '*.DS_Store' 'tests/*'
          cp ../../dist/PRIDE_KEEPER_Staff_latest.zip ../../dist/PRIDE_KEEPER_Helper_latest.zip
      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "PRIDE KEEPER Helper v${VERSION}" --notes "Модульная сборка PRIDE KEEPER Helper v${VERSION}. Синтаксис, ресурсы manifest и автотесты проверены." --latest
            gh release upload latest dist/*.zip --clobber
          else
            gh release create latest dist/*.zip --title "PRIDE KEEPER Helper v${VERSION}" --notes "Модульная сборка PRIDE KEEPER Helper v${VERSION}. Синтаксис, ресурсы manifest и автотесты проверены." --latest
          fi

